name: 编译葫芦侠（deb + dylib）

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      scheme:
        description: '越狱类型（RootHide 选 roothide）'
        required: true
        default: 'roothide'
        type: choice
        options: [roothide, rootless, rootful]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 theos + iOS SDK + ldid
        uses: waruhachi/theos-action@v2.6.5
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: 定位 theos（自动探测，不写死路径）
        run: |
          if [ -z "$THEOS" ] || [ ! -f "$THEOS/makefiles/common.mk" ]; then
            for c in "$GITHUB_WORKSPACE/theos" "$HOME/theos" "/Users/runner/theos"; do
              if [ -f "$c/makefiles/common.mk" ]; then
                export THEOS="$c"; break
              fi
            done
          fi
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "--- 确认 ---"
          ls "$THEOS/makefiles/common.mk"
          ls "$THEOS/sdks/" 2>/dev/null || echo "(sdks 未列出)"

      - name: 生成完整工程
        env:
          HULUXIA_SCHEME: ${{ github.event.inputs.scheme || 'roothide' }}
        run: |
          sh huluxia.sh gen ./proj
          ls proj

      - name: 编译 单体注入 dylib（TrollFool 用）
        continue-on-error: true
        run: |
          cd proj/mono
          make clean || true
          {
            make THEOS_PACKAGE_SCHEME=${{ github.event.inputs.scheme || 'roothide' }} 2>&1
            echo "EXIT=$?"
            echo "--- 找 dylib ---"
            find . .theos -name "*.dylib" -print 2>/dev/null || echo "(未找到)"
          } | tee ../../log-mono.txt
          mkdir -p ../../out
          find . .theos -name "HuluXiaInject.dylib" -exec cp {} ../../out/ \; 2>/dev/null || true

      - name: 编译 桌面App deb
        continue-on-error: true
        run: |
          cd proj
          perl -pi -e 's/^SUBPROJECTS = .*/SUBPROJECTS = app/' Makefile
          make clean || true
          {
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ github.event.inputs.scheme || 'roothide' }} 2>&1
            echo "EXIT=$?"
            echo "--- 找 deb ---"
            find . -name "*.deb" -print 2>/dev/null || echo "(未找到)"
          } | tee ../log-app.txt
          mkdir -p ../out
          find . -name "*.deb" -exec cp {} ../out/葫芦侠-桌面App.deb \; 2>/dev/null || true

      - name: 整理产物
        run: |
          mkdir -p out
          cp log-mono.txt out/ 2>/dev/null || true
          cp log-app.txt out/ 2>/dev/null || true
          echo "=== out ==="
          ls -la out/ || true

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: 葫芦侠-${{ github.event.inputs.scheme || 'roothide' }}
          path: out/*
          if-no-files-found: warn
