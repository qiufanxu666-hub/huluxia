name: Build Huluxia 1.0.0 - Stage 5A iOS 8-26 Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_bundle_id:
        description: "可选：需要启用变速代理的游戏 Bundle ID（留空则只构建默认配置）"
        required: false
        type: string
      native_diagnostic:
        description: "诊断构建：使用纯 UIKit 面板，跳过 WKWebView/HTML（仅用于定位崩溃）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 支持把完整工程 ZIP 上传到仓库根目录；优先解压明确命名的 1.0.0 工程包。
      - name: Unpack project ZIP if needed
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f Makefile ]]; then
            shopt -s nullglob
            zips=(Huluxia_1.0.0_阶段4E_原生面板诊断分支源码.zip Huluxia_1.0.0_阶段4D_面板初始化顺序修正.zip Huluxia_1.0.0_阶段4C_GamePlayer窗口生命周期对齐源码.zip Huluxia_1.0.0_阶段4B_CI修正版源码.zip Huluxia_1.0.0_阶段4B_窗口Scene绑定修正源码.zip Huluxia_1.0.0_阶段3B_悬浮球崩溃修复源码.zip)
            selected_zip=""
            for candidate in "${zips[@]}"; do
              if [[ -f "$candidate" ]]; then selected_zip="$candidate"; break; fi
            done
            if [[ -z "$selected_zip" ]]; then
              echo "❌ 根目录没有 Makefile。请上传并解压阶段4E源码包，或将 Huluxia_1.0.0_阶段4E_原生面板诊断分支源码.zip 放在仓库根目录。"
              exit 1
            fi
            echo "使用源码包：$selected_zip"
            unzip -oq "$selected_zip" -d .project_unpacked
            project_makefile="$(find .project_unpacked -mindepth 2 -maxdepth 4 -name Makefile -not -path '*/Launcher/*' -print -quit)"
            [[ -n "$project_makefile" ]] || { echo "❌ ZIP 中找不到工程 Makefile"; exit 1; }
            project_root="$(dirname "$project_makefile")"
            cp -a "$project_root"/. .
          fi
          echo "工程根目录：$PWD"
          test -f Makefile
          test -f .github/workflows/build.yml || echo "::warning::ZIP 未包含 workflow；当前运行使用仓库中的 build.yml"

      - name: Check required source files
        shell: bash
        run: |
          set -euo pipefail
          files=(Makefile control Huluxia.plist Sources/Tweak.m Sources/HLXMemory.m Sources/HLXBridge.m Sources/HLXOverlay.m Sources/HLXSpeed.m Sources/HLXTouch.m Resources/ui.html Resources/ball.png Launcher/Makefile Launcher/main.m Launcher/Resources/Info.plist Launcher/Resources/Icon@2x.png Launcher/Resources/Icon@3x.png build_dylib.sh build_trollstore_ipa.sh verify_build.sh configure_target.sh verify_overlay_safety.py verify_stage4a_source.py verify_stage4b_source.py verify_stage4c_source.py verify_stage4d_source.py verify_stage4e_source.py verify_compatibility.py COMPATIBILITY_IOS8_26.md set_package_minimum.sh Sources/HLXSpeedLegacy.m Huluxia_TrollStore.plist)
          missing=0
          for f in "${files[@]}"; do
            if [[ ! -e "$f" ]]; then echo "❌ Missing: $f"; missing=1; fi
          done
          (( missing == 0 )) || exit 1
          echo "✅ Required source files are present"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version | head -1

      - name: Configure optional game injection target
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_bundle_id != '' }}
        shell: bash
        env:
          TARGET_BUNDLE_ID: ${{ inputs.target_bundle_id }}
        run: |
          set -euo pipefail
          ./configure_target.sh "$TARGET_BUNDLE_ID"

      - name: Validate target filter and scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n configure_target.sh build_dylib.sh build_trollstore_ipa.sh verify_build.sh
          python3 verify_overlay_safety.py
          python3 verify_stage4a_source.py
          python3 verify_stage4b_source.py
          python3 verify_stage4c_source.py
          python3 verify_stage4d_source.py
          python3 verify_stage4e_source.py
          python3 verify_compatibility.py
          bash -n set_package_minimum.sh
          python3 - <<'PY'
          import plistlib
          for path in ('Huluxia.plist', 'Huluxia_TrollStore.plist', 'Launcher/Resources/Info.plist'):
              with open(path, 'rb') as f: plistlib.load(f)
              print('OK plist:', path)
          with open('Huluxia.plist', 'rb') as f: data = plistlib.load(f)
          assert 'com.apple.springboard' in data['Filter']['Bundles']
          print('OK SpringBoard control target retained')
          PY
          if grep -q '^INSTALL_TARGET_PROCESSES[[:space:]]*=' Makefile; then
            echo 'Unexpected install-time process termination configured' >&2
            exit 1
          fi
          echo 'OK: install does not force SpringBoard restart'

      - name: Check PNG dimensions
        run: |
          python3 - <<'PY'
          import struct
          expected = {
              'Launcher/Resources/Icon@2x.png': (120, 120),
              'Launcher/Resources/Icon@3x.png': (180, 180),
              'Resources/ball.png': (256, 256),
          }
          for path, want in expected.items():
              with open(path, 'rb') as f: data = f.read(24)
              if data[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit(f'{path}: not PNG')
              got = struct.unpack('>II', data[16:24])
              if got != want: raise SystemExit(f'{path}: {got}, expected {want}')
              print(f'OK {path}: {got}')
          PY

      - name: Install build dependencies
        run: |
          brew install ldid dpkg make xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos and legacy SDK
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          test -d "$HOME/theos/sdks/iPhoneOS11.2.sdk"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build legacy iOS 8-10 DEB (armv7 + arm64)
        shell: bash
        env:
          NATIVE_DIAGNOSTIC: ${{ inputs.native_diagnostic }}
        run: |
          set -euo pipefail
          rm -rf packages
          mkdir -p out
          make clean
          ./set_package_minimum.sh 8.0
          MAKE_DIAG=()
          if [[ "${NATIVE_DIAGNOSTIC}" == "true" ]]; then MAKE_DIAG=(HLX_NATIVE_DIAGNOSTIC=1); fi
          make package FINALPACKAGE=1 HLX_BUILD_FAMILY=legacy "${MAKE_DIAG[@]}"
          debs=(packages/*.deb)
          [[ ${#debs[@]} -eq 1 ]] || { echo "Expected one legacy DEB"; ls -lah packages; exit 1; }
          cp "${debs[0]}" "out/$(basename "${debs[0]%.deb}")_legacy_armv7_arm64.deb"
          test -s out/*_legacy_armv7_arm64.deb

      - name: Build rootful DEB
        shell: bash
        env:
          NATIVE_DIAGNOSTIC: ${{ inputs.native_diagnostic }}
        run: |
          set -euo pipefail
          rm -rf packages
          mkdir -p out
          make clean
          ./set_package_minimum.sh 11.0
          MAKE_DIAG=()
          if [[ "${NATIVE_DIAGNOSTIC}" == "true" ]]; then MAKE_DIAG=(HLX_NATIVE_DIAGNOSTIC=1); fi
          make package FINALPACKAGE=1 HLX_BUILD_FAMILY=modern "${MAKE_DIAG[@]}"
          debs=(packages/*.deb)
          [[ ${#debs[@]} -eq 1 ]] || { echo "Expected one rootful DEB"; ls -lah packages; exit 1; }
          cp "${debs[0]}" "out/$(basename "${debs[0]%.deb}")_modern_rootful.deb"
          test -s out/*_modern_rootful.deb

      - name: Build rootless DEB
        shell: bash
        env:
          NATIVE_DIAGNOSTIC: ${{ inputs.native_diagnostic }}
        run: |
          set -euo pipefail
          rm -rf packages
          make clean
          ./set_package_minimum.sh 15.0
          MAKE_DIAG=()
          if [[ "${NATIVE_DIAGNOSTIC}" == "true" ]]; then MAKE_DIAG=(HLX_NATIVE_DIAGNOSTIC=1); fi
          make package FINALPACKAGE=1 HLX_BUILD_FAMILY=modern THEOS_PACKAGE_SCHEME=rootless "${MAKE_DIAG[@]}"
          debs=(packages/*.deb)
          [[ ${#debs[@]} -eq 1 ]] || { echo "Expected one rootless DEB"; ls -lah packages; exit 1; }
          cp "${debs[0]}" "out/$(basename "${debs[0]%.deb}")_rootless.deb"
          test -s out/*_rootless.deb

      - name: Build standalone DYLIB
        shell: bash
        env:
          HLX_NATIVE_DIAGNOSTIC: ${{ inputs.native_diagnostic && '1' || '0' }}
        run: |
          set -euo pipefail
          chmod +x build_dylib.sh
          ./build_dylib.sh
          test -s build/Huluxia.dylib
          cp build/Huluxia.dylib out/Huluxia.dylib
          test -s out/Huluxia.dylib

      # 此步骤必须存在于实际仓库的 .github/workflows/build.yml 中；不能只放在 ZIP 说明里。
      - name: Build TrollStore companion IPA
        shell: bash
        run: |
          set -euo pipefail
          ROOTFUL_DEB="$(find "$GITHUB_WORKSPACE/out" -maxdepth 1 -type f -name '*modern_rootful.deb' -print -quit)"
          [[ -n "$ROOTFUL_DEB" ]] || { echo "❌ rootful DEB missing; cannot assemble launcher IPA"; ls -lah out; exit 1; }
          chmod +x build_trollstore_ipa.sh
          ./build_trollstore_ipa.sh "$GITHUB_WORKSPACE/out" "$ROOTFUL_DEB"
          cp Huluxia_TrollStore.plist out/Huluxia_TrollStore.plist
          test -s out/Huluxia_TrollStore.ipa
          echo "✅ IPA generated: $GITHUB_WORKSPACE/out/Huluxia_TrollStore.ipa"
          ls -lh out/Huluxia_TrollStore.ipa

      - name: Verify artifacts (DEB / DYLIB / IPA and identical embedded resources)
        shell: bash
        run: |
          set -euo pipefail
          echo '── Build output ──'
          ls -lah out
          test -s out/Huluxia_TrollStore.ipa
          test -s out/Huluxia.dylib
          chmod +x verify_build.sh
          ./verify_build.sh out

      - name: Assemble release folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/Huluxia_Release
          mkdir -p out/Huluxia_Release/越狱版 out/Huluxia_Release/TrollStore版
          cp out/*_rootful.deb out/Huluxia_Release/越狱版/
          cp out/*_rootless.deb out/Huluxia_Release/越狱版/
          cp out/Huluxia_TrollStore.ipa out/Huluxia_Release/TrollStore版/
          cp out/Huluxia.dylib out/Huluxia_Release/TrollStore版/
          cp out/Huluxia_TrollStore.plist out/Huluxia_Release/TrollStore版/
          cat > out/Huluxia_Release/使用说明.txt <<'EOF'
          葫芦侠 1.0.0
          越狱版：iOS 8-10 选择 legacy_armv7_arm64；iOS 11+ 选择 modern_rootful；iOS 15+ rootless 越狱选择 modern_rootless。
          TrollStore版：IPA 内嵌 Huluxia.dylib；独立 DYLIB 同时提供。
          TrollStore 不等同于越狱注入：沙盒/签名权限限制下，不能据此宣称可注入 SpringBoard 或修改其他 App 进程内存。
          安装前请确认设备系统版本与 TrollStore 官方支持范围兼容。
          EOF

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Huluxia_1.0.0_Release
          path: out/Huluxia_Release/
          if-no-files-found: error
