name: Build Huluxia 1.0.0 - Stage 5E source-selection and iOS16 diagnosis

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_bundle_id:
        description: "可选：需要启用变速代理的游戏 Bundle ID（留空则只构建默认配置）"
        required: false
        type: string
      native_diagnostic:
        description: "诊断构建：使用纯 UIKit 面板，跳过 WKWebView/HTML（仅用于定位崩溃）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # 自动识别：仓库根目录、上传的工程子目录，或 ZIP 压缩包。
      - name: Locate project sources
        shell: bash
        run: |
          set -euo pipefail
          # Prefer the explicitly versioned project archive even when the
          # repository still contains an older root Makefile. This prevents
          # a newly uploaded ZIP from being silently ignored.
          selected_zip=""
          # Always select the newest explicit source archive first. The previous
          # workflow listed Stage 5A archives before Stage 5D and could silently
          # overwrite the checked-in workflow's project with stale sources.
          for candidate in \
            Huluxia_1.0.0_阶段5E_工作流选源修复与iOS16诊断.zip \
            Huluxia_1.0.0_阶段5D_跨进程失败保护与选择状态修复源码.zip \
            Huluxia_1.0.0_阶段5C_DopamineRootless_iOS16_面板加载修复源码.zip \
            Huluxia_1.0.0_阶段5B_GamePlayer跨进程_DWORD_WORD_BYTE.zip \
            Huluxia_1.0.0_阶段5A_iOS8-26_兼容修复_V5_Bash32安全版.zip \
            Huluxia_1.0.0_阶段5A_iOS8-26_兼容修复_V4.zip \
            Huluxia_1.0.0_阶段5A_iOS8-26_单YML版.zip \
            Huluxia_1.0.0_阶段5A_iOS8-26_兼容工程.zip; do
            if [[ -f "$candidate" ]]; then selected_zip="$candidate"; break; fi
          done
          if [[ -z "$selected_zip" ]]; then
            # Last-resort glob is deterministic and excludes unrelated archives.
            selected_zip="$(find . -maxdepth 1 -type f -name 'Huluxia*.zip' -print | sort -r | head -n 1 || true)"
          fi

          if [[ -n "$selected_zip" ]]; then
            echo "优先使用版本化源码包：$selected_zip"
            rm -rf .project_unpacked
            mkdir -p .project_unpacked
            unzip -oq "$selected_zip" -d .project_unpacked
            project_makefile="$(find .project_unpacked -mindepth 1 -maxdepth 7 -type f -name Makefile \
              -not -path '*/Launcher/Makefile' -print -quit)"
            [[ -n "$project_makefile" ]] || { echo "❌ ZIP 中找不到主工程 Makefile"; exit 1; }
            project_root="$(dirname "$project_makefile")"
            cp -a "$project_root"/. .
          elif [[ -f Makefile ]]; then
            echo "未发现版本化源码包，使用仓库根目录工程"
          else
            project_makefile="$(find . -mindepth 2 -maxdepth 6 -type f -name Makefile \
              -not -path './.git/*' -not -path './.theos/*' \
              -not -path '*/Launcher/Makefile' -print -quit || true)"
            if [[ -n "$project_makefile" ]]; then
              project_root="$(dirname "$project_makefile")"
              echo "发现工程目录：$project_root"
              cp -a "$project_root"/. .
            else
              echo "❌ 找不到 Makefile，也没有可识别的 Huluxia 工程 ZIP。请上传完整 V5 ZIP。"
              exit 1
            fi
          fi
          echo "工程根目录：$PWD"
          test -f Makefile
          test -f Sources/HLXOverlay.m
          test -f Resources/ui.html

      - name: Check required source files
        shell: bash
        run: |
          set -euo pipefail
          files=(Makefile control Huluxia.plist Sources/Tweak.m Sources/HLXMemory.m Sources/HLXBridge.m Sources/HLXOverlay.m Sources/HLXSpeed.m Sources/HLXTouch.m Resources/ui.html Resources/ball.png Launcher/Makefile Launcher/main.m Launcher/Resources/Info.plist Launcher/Resources/Icon@2x.png Launcher/Resources/Icon@3x.png build_dylib.sh build_trollstore_ipa.sh verify_build.sh configure_target.sh verify_overlay_safety.py verify_stage4a_source.py verify_stage4b_source.py verify_stage4c_source.py verify_stage4d_source.py verify_stage4e_source.py verify_stage5b_source.py verify_compatibility.py COMPATIBILITY_IOS8_26.md set_package_minimum.sh Sources/HLXSpeedLegacy.m Huluxia_TrollStore.plist)
          missing=0
          for f in "${files[@]}"; do
            if [[ ! -e "$f" ]]; then echo "❌ Missing: $f"; missing=1; fi
          done
          (( missing == 0 )) || exit 1
          echo "✅ Required source files are present"
          echo "── Source provenance ──"
          shasum -a 256 Makefile Sources/HLXOverlay.m Sources/HLXMemory.m Resources/ui.html
          grep -q 'HLX_NATIVE_DIAGNOSTIC' Makefile
          grep -q 'stage4e native diagnostic panel loaded; WebKit bypassed' Sources/HLXOverlay.m
          echo "[HLX-STAGE5E-SOURCE-CHECK] selected source contains native diagnostic branch"

      # ZIP 下载/解压可能丢失 Unix executable bit；统一恢复顶层 shell 脚本权限。
      - name: Normalize shell script permissions
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.sh' -exec chmod 0755 {} +
          echo "Shell scripts permissions:"
          ls -l ./*.sh

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version | head -1

      - name: Configure optional game injection target
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_bundle_id != '' }}
        shell: bash
        env:
          TARGET_BUNDLE_ID: ${{ inputs.target_bundle_id }}
        run: |
          set -euo pipefail
          bash ./configure_target.sh "$TARGET_BUNDLE_ID"

      - name: Validate target filter and scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n configure_target.sh build_dylib.sh build_trollstore_ipa.sh verify_build.sh
          python3 verify_overlay_safety.py
          python3 verify_stage4a_source.py
          python3 verify_stage4b_source.py
          python3 verify_stage4c_source.py
          python3 verify_stage4d_source.py
          python3 verify_stage4e_source.py
          python3 verify_stage5b_source.py
          python3 verify_compatibility.py
          bash -n set_package_minimum.sh
          python3 - <<'PY'
          import plistlib
          for path in ('Huluxia.plist', 'Huluxia_TrollStore.plist', 'Launcher/Resources/Info.plist'):
              with open(path, 'rb') as f: plistlib.load(f)
              print('OK plist:', path)
          with open('Huluxia.plist', 'rb') as f: data = plistlib.load(f)
          assert 'com.apple.springboard' in data['Filter']['Bundles']
          print('OK SpringBoard control target retained')
          PY
          if grep -q '^INSTALL_TARGET_PROCESSES[[:space:]]*=' Makefile; then
            echo 'Unexpected install-time process termination configured' >&2
            exit 1
          fi
          echo 'OK: install does not force SpringBoard restart'

      - name: Check PNG dimensions
        run: |
          python3 - <<'PY'
          import struct
          expected = {
              'Launcher/Resources/Icon@2x.png': (120, 120),
              'Launcher/Resources/Icon@3x.png': (180, 180),
              'Resources/ball.png': (256, 256),
          }
          for path, want in expected.items():
              with open(path, 'rb') as f: data = f.read(24)
              if data[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit(f'{path}: not PNG')
              got = struct.unpack('>II', data[16:24])
              if got != want: raise SystemExit(f'{path}: {got}, expected {want}')
              print(f'OK {path}: {got}')
          PY

      - name: Install build dependencies
        run: |
          brew install ldid dpkg make xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos and legacy SDK (V2 collision-proof)
        shell: bash
        run: |
          set -euo pipefail
          echo "[HLX-SDK-INSTALL-V2] install Theos, stage SDK repo separately, then copy SDK bundles"
          THEOS_DIR="$HOME/theos"
          SDK_REPO="$RUNNER_TEMP/theos-sdk-repo"
          rm -rf "$THEOS_DIR" "$SDK_REPO"
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS_DIR"

          # Theos itself creates $THEOS/sdks as an existing directory.
          # The official theos/sdks README instructs users to COPY SDK bundles into it,
          # not to git-clone the repository on top of that directory.
          git clone --depth=1 https://github.com/theos/sdks.git "$SDK_REPO"
          mkdir -p "$THEOS_DIR/sdks"
          sdk_count=0
          for sdk in "$SDK_REPO"/iPhoneOS*.sdk; do
            [[ -d "$sdk" ]] || continue
            cp -R "$sdk" "$THEOS_DIR/sdks/"
            sdk_count=$((sdk_count + 1))
          done
          [[ "$sdk_count" -gt 0 ]] || { echo "❌ No iPhoneOS SDK bundles found in theos/sdks checkout"; exit 1; }
          test -d "$THEOS_DIR/sdks/iPhoneOS11.4.sdk"
          test -d "$THEOS_DIR/sdks/iPhoneOS9.3.sdk"
          echo "Installed patched SDKs:"
          find "$THEOS_DIR/sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' -print | sort
          echo "THEOS=$THEOS_DIR" >> "$GITHUB_ENV"
          echo "[HLX-SDK-INSTALL-V2] complete; SDK directory was never used as a git-clone destination"

      - name: Build legacy iOS 8-10 DEB (armv7 + arm64)
        shell: bash
        env:
          NATIVE_DIAGNOSTIC: ${{ inputs.native_diagnostic }}
        run: |
          set -euo pipefail
          rm -rf packages
          mkdir -p out
          make clean
          bash ./set_package_minimum.sh 8.0
          # macOS runners may use Bash 3.2: expanding an empty array under
          # `set -u` raises "unbound variable". Avoid optional empty arrays.
          if [[ "${NATIVE_DIAGNOSTIC:-false}" == "true" ]]; then
            make package FINALPACKAGE=1 HLX_BUILD_FAMILY=legacy HLX_NATIVE_DIAGNOSTIC=1
          else
            make package FINALPACKAGE=1 HLX_BUILD_FAMILY=legacy
          fi
          deb_count="$(find packages -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')"
          [[ "$deb_count" -eq 1 ]] || { echo "Expected one legacy DEB, found $deb_count"; ls -lah packages; exit 1; }
          legacy_deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          cp "$legacy_deb" "out/$(basename "${legacy_deb%.deb}")_legacy_armv7_arm64.deb"
          test -s out/*_legacy_armv7_arm64.deb

      - name: Build rootful DEB
        shell: bash
        env:
          NATIVE_DIAGNOSTIC: ${{ inputs.native_diagnostic }}
        run: |
          set -euo pipefail
          rm -rf packages
          mkdir -p out
          make clean
          bash ./set_package_minimum.sh 11.0
          # Avoid empty-array expansion under macOS system Bash 3.2 + nounset.
          if [[ "${NATIVE_DIAGNOSTIC:-false}" == "true" ]]; then
            make package FINALPACKAGE=1 HLX_BUILD_FAMILY=modern HLX_NATIVE_DIAGNOSTIC=1
          else
            make package FINALPACKAGE=1 HLX_BUILD_FAMILY=modern
          fi
          deb_count="$(find packages -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')"
          [[ "$deb_count" -eq 1 ]] || { echo "Expected one rootful DEB, found $deb_count"; ls -lah packages; exit 1; }
          rootful_deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          cp "$rootful_deb" "out/$(basename "${rootful_deb%.deb}")_modern_rootful.deb"
          test -s out/*_modern_rootful.deb

      - name: Build rootless DEB
        shell: bash
        env:
          NATIVE_DIAGNOSTIC: ${{ inputs.native_diagnostic }}
        run: |
          set -euo pipefail
          rm -rf packages
          make clean
          bash ./set_package_minimum.sh 15.0
          # Avoid empty-array expansion under macOS system Bash 3.2 + nounset.
          if [[ "${NATIVE_DIAGNOSTIC:-false}" == "true" ]]; then
            make package FINALPACKAGE=1 HLX_BUILD_FAMILY=modern THEOS_PACKAGE_SCHEME=rootless HLX_NATIVE_DIAGNOSTIC=1
          else
            make package FINALPACKAGE=1 HLX_BUILD_FAMILY=modern THEOS_PACKAGE_SCHEME=rootless
          fi
          deb_count="$(find packages -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')"
          [[ "$deb_count" -eq 1 ]] || { echo "Expected one rootless DEB, found $deb_count"; ls -lah packages; exit 1; }
          rootless_deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          cp "$rootless_deb" "out/$(basename "${rootless_deb%.deb}")_rootless.deb"
          test -s out/*_rootless.deb

      - name: Build standalone DYLIB
        shell: bash
        env:
          HLX_NATIVE_DIAGNOSTIC: ${{ inputs.native_diagnostic && '1' || '0' }}
        run: |
          set -euo pipefail
          chmod +x build_dylib.sh
          ./build_dylib.sh
          test -s build/Huluxia.dylib
          cp build/Huluxia.dylib out/Huluxia.dylib
          test -s out/Huluxia.dylib

      # 此步骤必须存在于实际仓库的 .github/workflows/build.yml 中；不能只放在 ZIP 说明里。
      - name: Build TrollStore companion IPA
        shell: bash
        run: |
          set -euo pipefail
          ROOTFUL_DEB="$(find "$GITHUB_WORKSPACE/out" -maxdepth 1 -type f -name '*modern_rootful.deb' -print -quit)"
          [[ -n "$ROOTFUL_DEB" ]] || { echo "❌ rootful DEB missing; cannot assemble launcher IPA"; ls -lah out; exit 1; }
          chmod +x build_trollstore_ipa.sh
          ./build_trollstore_ipa.sh "$GITHUB_WORKSPACE/out" "$ROOTFUL_DEB"
          cp Huluxia_TrollStore.plist out/Huluxia_TrollStore.plist
          test -s out/Huluxia_TrollStore.ipa
          echo "✅ IPA generated: $GITHUB_WORKSPACE/out/Huluxia_TrollStore.ipa"
          ls -lh out/Huluxia_TrollStore.ipa

      - name: Verify artifacts (DEB / DYLIB / IPA and identical embedded resources)
        shell: bash
        run: |
          set -euo pipefail
          echo '── Build output ──'
          ls -lah out
          test -s out/Huluxia_TrollStore.ipa
          test -s out/Huluxia.dylib
          chmod +x verify_build.sh
          ./verify_build.sh out

      - name: Assemble release folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/Huluxia_Release
          mkdir -p out/Huluxia_Release/越狱版 out/Huluxia_Release/TrollStore版
          cp out/*_legacy_armv7_arm64.deb out/Huluxia_Release/越狱版/
          cp out/*_rootful.deb out/Huluxia_Release/越狱版/
          cp out/*_rootless.deb out/Huluxia_Release/越狱版/
          cp out/Huluxia_TrollStore.ipa out/Huluxia_Release/TrollStore版/
          cp out/Huluxia.dylib out/Huluxia_Release/TrollStore版/
          cp out/Huluxia_TrollStore.plist out/Huluxia_Release/TrollStore版/
          cat > out/Huluxia_Release/使用说明.txt <<'EOF'
          葫芦侠 1.0.0
          本次构建 native_diagnostic=true 时，DEB/DYLIB 是纯 UIKit 诊断版，不含 HTML/Lua 操作面板；仅用于区分窗口层与 WebKit 层问题，不作为日常功能版。
          本次构建 native_diagnostic=false 时，才是完整 HTML/Lua 面板版。
          越狱版：iOS 8-10 选择 legacy_armv7_arm64；iOS 11+ Rootful 选择 modern_rootful；iOS 15+ Rootless（含 Dopamine）选择 modern_rootless。
          modern_rootful 与 modern_rootless 构建目标均显式包含 arm64 + arm64e；legacy 包包含 armv7 + arm64。
          TrollStore版：IPA 内嵌 Huluxia.dylib；独立 DYLIB 同时提供。
          TrollStore 不等同于越狱注入：沙盒/签名权限限制下，不能据此宣称可注入 SpringBoard 或修改其他 App 进程内存。
          安装前请确认设备系统版本与 TrollStore 官方支持范围兼容。
          EOF

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Huluxia_1.0.0_Release
          path: out/Huluxia_Release/
          if-no-files-found: error
