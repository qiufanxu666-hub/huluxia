name: Build Huluxia

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ── Lua / GG 兼容层测试：真实加载 ui.html（含 Fengari），挂模拟宿主；不覆盖原生内存引擎 ──
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notice if tests/ is missing
        if: hashFiles('tests/lua_gg_test.mjs') == ''
        run: echo "::warning::仓库里没有 tests/ 目录，已跳过 Lua/GG 测试（不影响编译）"
      - uses: actions/setup-node@v4
        if: hashFiles('tests/lua_gg_test.mjs') != ''
        with:
          node-version: 22
      - name: Install Playwright
        if: hashFiles('tests/lua_gg_test.mjs') != ''
        working-directory: tests
        run: |
          npm init -y >/dev/null
          npm install playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Run Lua/GG tests
        if: hashFiles('tests/lua_gg_test.mjs') != ''
        working-directory: tests
        run: node lua_gg_test.mjs ../Resources/ui.html ci
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('tests/lua_gg_test.mjs') != ''
        with:
          name: lua-test-results
          path: tests/results_ci.json
          if-no-files-found: warn

  build:
    needs: lua-tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check required files (缺文件时直接列出，不再让后面步骤莫名其妙失败)
        run: |
          missing=0
          for f in Makefile control Huluxia.plist Sources/Tweak.m Sources/HLXMemory.m Sources/HLXBridge.m Sources/HLXOverlay.m Sources/HLXSpeed.m Sources/HLXTouch.m Resources/ui.html Resources/ball.png Launcher/Makefile Launcher/main.m Launcher/Resources/Info.plist Launcher/Resources/Icon@2x.png Launcher/Resources/Icon@3x.png build_dylib.sh; do
            if [ ! -e "$f" ]; then echo "❌ 缺少: $f"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then echo "仓库根目录缺少上面列出的文件/文件夹，请补传（注意文件夹要连同里面的文件一起传）"; exit 1; fi
          echo "✅ 必需文件齐全"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version | head -1

      - name: Check icon resources (尺寸必须符合 iOS 规格)
        run: |
          python3 - <<'PY'
          import struct, sys
          def size(p):
              d = open(p, 'rb').read(24)
              assert d[:8] == b'\x89PNG\r\n\x1a\n', p + ' 不是 PNG'
              return struct.unpack('>II', d[16:24])
          want = {'Launcher/Resources/Icon@2x.png': (120, 120), 'Launcher/Resources/Icon@3x.png': (180, 180), 'Resources/ball.png': (256, 256)}
          bad = [f'{p}: {size(p)} != {w}' for p, w in want.items() if size(p) != w]
          if bad: sys.exit('图标尺寸不对:\n' + '\n'.join(bad))
          print('icon sizes OK')
          PY

      - name: Install tools
        run: |
          brew install ldid dpkg make xz
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build rootful deb (越狱 /Library)
        run: |
          rm -rf packages out && mkdir -p out
          make clean
          make package FINALPACKAGE=1
          debs=(packages/*.deb); [ "${#debs[@]}" -eq 1 ] || { echo "期望 1 个 deb，实际 ${#debs[@]}"; ls -la packages; exit 1; }
          cp "${debs[0]}" "out/$(basename "${debs[0]%.deb}")_rootful.deb"

      - name: Build rootless deb (Dopamine / palera1n rootless)
        run: |
          rm -rf packages      # 清掉上一步的 rootful 包，避免被错标成 rootless
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          debs=(packages/*.deb); [ "${#debs[@]}" -eq 1 ] || { echo "期望 1 个 deb，实际 ${#debs[@]}"; ls -la packages; exit 1; }
          cp "${debs[0]}" "out/$(basename "${debs[0]%.deb}")_rootless.deb"

      - name: Build standalone dylib (免越狱注入 IPA)
        run: |
          ./build_dylib.sh
          cp build/Huluxia.dylib out/

      - name: Verify artifacts (deb 与 dylib 必须内嵌仓库里的同一份 ui.html / ball.png / 图标)
        if: hashFiles('verify_build.sh') != ''
        run: |
          chmod +x verify_build.sh
          ./verify_build.sh out

      - uses: actions/upload-artifact@v4
        with:
          name: Huluxia
          path: out/*
          if-no-files-found: error
