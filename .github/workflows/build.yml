
name: Build HuluXia

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      target_bundles:
        description: "授权测试应用的 Bundle ID，多个用逗号分隔"
        required: false
        default: "com.example.authorizedapp"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        scheme:
          - rootless
          - rootful

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make ldid dpkg

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          rm -rf "$RUNNER_TEMP/theos/sdks"
          git clone https://github.com/theos/sdks.git "$RUNNER_TEMP/theos/sdks"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      - name: Check project files
        run: |
          test -f Makefile
          test -f control
          test -f scripts/build.sh
          test -f Tweak/HuluXiaTweak.m
          chmod +x scripts/build.sh

      - name: Build package
        env:
          TARGET_BUNDLES: ${{ inputs.target_bundles || 'com.example.authorizedapp' }}
          THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}
        run: |
          ./scripts/build.sh

      - name: Verify build output
        run: |
          test -d build-output
          find build-output -type f
          test -n "$(find build-output -name '*.deb' -type f)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HuluXia-${{ matrix.scheme }}
          path: build-output/*
          if-no-files-found: error
