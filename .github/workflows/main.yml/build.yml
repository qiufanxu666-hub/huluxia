name: Build Huluxia 1.0.0

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 支持把完整工程 ZIP 上传到仓库根目录；优先解压明确命名的 1.0.0 工程包。
      - name: Unpack project ZIP if needed
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f Makefile ]]; then
            shopt -s nullglob
            zips=(Huluxia*1.0.0*.zip Huluxia*.zip)
            if (( ${#zips[@]} == 0 )); then
              echo "❌ 根目录没有 Makefile，也没有可解压的 Huluxia 工程 ZIP"
              exit 1
            fi
            unzip -oq "${zips[0]}" -d .project_unpacked
            project_makefile="$(find .project_unpacked -mindepth 2 -maxdepth 4 -name Makefile -not -path '*/Launcher/*' -print -quit)"
            [[ -n "$project_makefile" ]] || { echo "❌ ZIP 中找不到工程 Makefile"; exit 1; }
            project_root="$(dirname "$project_makefile")"
            cp -a "$project_root"/. .
          fi
          echo "工程根目录：$PWD"
          test -f Makefile
          test -f .github/workflows/build.yml || echo "::warning::ZIP 未包含 workflow；当前运行使用仓库中的 build.yml"

      - name: Check required source files
        shell: bash
        run: |
          set -euo pipefail
          files=(Makefile control Huluxia.plist Sources/Tweak.m Sources/HLXMemory.m Sources/HLXBridge.m Sources/HLXOverlay.m Sources/HLXSpeed.m Sources/HLXTouch.m Resources/ui.html Resources/ball.png Launcher/Makefile Launcher/main.m Launcher/Resources/Info.plist Launcher/Resources/Icon@2x.png Launcher/Resources/Icon@3x.png build_dylib.sh build_trollstore_ipa.sh verify_build.sh Huluxia_TrollStore.plist)
          missing=0
          for f in "${files[@]}"; do
            if [[ ! -e "$f" ]]; then echo "❌ Missing: $f"; missing=1; fi
          done
          (( missing == 0 )) || exit 1
          echo "✅ Required source files are present"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version | head -1

      - name: Check PNG dimensions
        run: |
          python3 - <<'PY'
          import struct
          expected = {
              'Launcher/Resources/Icon@2x.png': (120, 120),
              'Launcher/Resources/Icon@3x.png': (180, 180),
              'Resources/ball.png': (256, 256),
          }
          for path, want in expected.items():
              with open(path, 'rb') as f: data = f.read(24)
              if data[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit(f'{path}: not PNG')
              got = struct.unpack('>II', data[16:24])
              if got != want: raise SystemExit(f'{path}: {got}, expected {want}')
              print(f'OK {path}: {got}')
          PY

      - name: Install build dependencies
        run: |
          brew install ldid dpkg make xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build rootful DEB
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages out
          mkdir -p out
          make clean
          make package FINALPACKAGE=1
          debs=(packages/*.deb)
          [[ ${#debs[@]} -eq 1 ]] || { echo "Expected one rootful DEB"; ls -lah packages; exit 1; }
          cp "${debs[0]}" "out/$(basename "${debs[0]%.deb}")_rootful.deb"
          test -s out/*_rootful.deb

      - name: Build rootless DEB
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          debs=(packages/*.deb)
          [[ ${#debs[@]} -eq 1 ]] || { echo "Expected one rootless DEB"; ls -lah packages; exit 1; }
          cp "${debs[0]}" "out/$(basename "${debs[0]%.deb}")_rootless.deb"
          test -s out/*_rootless.deb

      - name: Build standalone DYLIB
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_dylib.sh
          ./build_dylib.sh
          test -s build/Huluxia.dylib
          cp build/Huluxia.dylib out/Huluxia.dylib
          test -s out/Huluxia.dylib

      # 此步骤必须存在于实际仓库的 .github/workflows/build.yml 中；不能只放在 ZIP 说明里。
      - name: Build TrollStore companion IPA
        shell: bash
        run: |
          set -euo pipefail
          ROOTFUL_DEB="$(find "$GITHUB_WORKSPACE/out" -maxdepth 1 -type f -name '*_rootful.deb' -print -quit)"
          [[ -n "$ROOTFUL_DEB" ]] || { echo "❌ rootful DEB missing; cannot assemble launcher IPA"; ls -lah out; exit 1; }
          chmod +x build_trollstore_ipa.sh
          ./build_trollstore_ipa.sh "$GITHUB_WORKSPACE/out" "$ROOTFUL_DEB"
          cp Huluxia_TrollStore.plist out/Huluxia_TrollStore.plist
          test -s out/Huluxia_TrollStore.ipa
          echo "✅ IPA generated: $GITHUB_WORKSPACE/out/Huluxia_TrollStore.ipa"
          ls -lh out/Huluxia_TrollStore.ipa

      - name: Verify artifacts (DEB / DYLIB / IPA and identical embedded resources)
        shell: bash
        run: |
          set -euo pipefail
          echo '── Build output ──'
          ls -lah out
          test -s out/Huluxia_TrollStore.ipa
          test -s out/Huluxia.dylib
          chmod +x verify_build.sh
          ./verify_build.sh out

      - name: Assemble release folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/Huluxia_Release
          mkdir -p out/Huluxia_Release/越狱版 out/Huluxia_Release/TrollStore版
          cp out/*_rootful.deb out/Huluxia_Release/越狱版/
          cp out/*_rootless.deb out/Huluxia_Release/越狱版/
          cp out/Huluxia_TrollStore.ipa out/Huluxia_Release/TrollStore版/
          cp out/Huluxia.dylib out/Huluxia_Release/TrollStore版/
          cp out/Huluxia_TrollStore.plist out/Huluxia_Release/TrollStore版/
          cat > out/Huluxia_Release/使用说明.txt <<'EOF'
          葫芦侠 1.0.0
          越狱版：根据设备环境选择 rootful 或 rootless DEB。
          TrollStore版：IPA 内嵌 Huluxia.dylib；独立 DYLIB 同时提供。
          TrollStore 不等同于越狱注入：沙盒/签名权限限制下，不能据此宣称可注入 SpringBoard 或修改其他 App 进程内存。
          安装前请确认设备系统版本与 TrollStore 官方支持范围兼容。
          EOF

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Huluxia_1.0.0_Release
          path: out/Huluxia_Release/
          if-no-files-found: error
